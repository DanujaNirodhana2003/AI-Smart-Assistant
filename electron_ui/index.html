<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="window-container">
        <div class="header">
            <div class="title-group">
                <span class="status-dot" id="status-dot"></span>
                <span class="title">AI ASSISTANT</span>
                <span class="connection-status" id="connection-status">Connecting</span>
            </div>
            <div class="window-controls">
                <button class="capture-btn" id="capture-btn" title="Capture text from your screen" aria-label="Capture text from your screen">Capture</button>
                <button class="header-btn" id="new-chat-btn" title="Start a new chat" aria-label="Start a new chat">＋</button>
                <button class="min-btn" id="min-btn">─</button>
                <button class="close-btn" id="close-btn">✕</button>
            </div>
        </div>
        <div class="chat-container">
            <div class="chat-history" id="chat-history">
                <!-- Chat bubbles will go here -->
            </div>
            <div class="quick-actions" aria-label="Quick actions">
                <button data-prompt="Explain this clearly and include a simple example:">Explain</button>
                <button data-prompt="Summarize the key points of this:">Summarize</button>
                <button data-prompt="Improve this and suggest a better version:">Improve</button>
                <button data-prompt="Brainstorm practical ideas for this:">Brainstorm</button>
            </div>
            <div class="input-container">
                <textarea id="chat-input" placeholder="Message your assistant..." rows="1"></textarea>
                <span class="input-hint">Enter to send</span>
                <button id="send-btn" title="Send message" aria-label="Send message">➤</button>
            </div>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
